<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#4F46E5"/>

  <!-- Multiplication symbol (×) -->
  <path d="M 35 25 L 65 75 M 65 25 L 35 75"
        stroke="white"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Small numbers around the multiplication symbol -->
  <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#A5B4FC">3</text>
  <text x="75" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#A5B4FC">7</text>
  <text x="15" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#A5B4FC">9</text>
  <text x="78" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#A5B4FC">4</text>
</svg>
