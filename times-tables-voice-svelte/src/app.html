<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Primary Meta Tags -->
		<title>Times Tables Voice Practice - Voice-Enabled Math Learning</title>
		<meta name="title" content="Times Tables Voice Practice - Voice-Enabled Math Learning" />
		<meta name="description" content="Practice multiplication times tables (0-12) using voice recognition. Speak your answers and get instant feedback! Requires Chrome, Edge, or another Chromium-based browser." />
		<meta name="keywords" content="times tables, multiplication, voice recognition, math practice, education, learning, voice-enabled" />

		<!-- Browser Compatibility Warning -->
		<meta name="browser-support" content="Chromium-based browsers only (Chrome, Edge, Brave, Opera). NOT compatible with Firefox or Safari due to Web Speech API limitations." />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Times Tables Voice Practice" />
		<meta property="og:description" content="Practice multiplication with voice recognition. Speak your answers and get instant feedback! Requires Chrome, Edge, or Chromium browser." />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary" />
		<meta property="twitter:title" content="Times Tables Voice Practice" />
		<meta property="twitter:description" content="Voice-enabled multiplication practice. Requires Chromium-based browser (Chrome, Edge, Brave)." />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
